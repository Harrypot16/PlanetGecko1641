    <script>
      // Suppress Vite HMR WebSocket connection failure noise in preview/iframe environment
      window.addEventListener('error', function(e) {
        if (e && (e.message?.includes('WebSocket') || e.target?.toString?.().includes('WebSocket'))) {
          e.stopImmediatePropagation();
        }
      }, true);
    </script>

    <div id="root"></div>
